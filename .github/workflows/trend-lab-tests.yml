name: Trend Lab tests
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'entry_ablation.py'
      - 'rotation_reserved.py'
      - 'rotation_stop_lab.py'
      - 'portfolio_validation.py'
      - 'research_presets.py'
      - 'validation_benchmarks.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/trend-lab-tests.yml'
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile modules
        run: python -m py_compile app.py entry_ablation.py research_presets.py validation_benchmarks.py portfolio_validation.py rotation_reserved.py rotation_stop_lab.py
      - name: Test
        run: pytest -q
