name: Validate Trend Lab Research Exits
on:
  pull_request:
    paths:
      - 'research_presets.py'
      - 'app.py'
      - 'engine.py'
      - 'tests/test_research_presets.py'
      - 'tests/test_streamlit_smoke.py'
      - '.github/workflows/validate-research-exits.yml'
  push:
    branches:
      - 'feature/trend-lab-presets-abc-20261107'
    paths:
      - 'research_presets.py'
      - 'engine.py'
      - 'tests/test_research_presets.py'
      - 'tests/test_streamlit_smoke.py'
      - '.github/workflows/validate-research-exits.yml'
jobs:
  test-research-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install testing requirements
        run: python -m pip install --disable-pip-version-check numpy pandas streamlit plotly
      - name: Compile research code
        run: python -m py_compile app.py research_presets.py engine.py tests/test_research_presets.py tests/test_streamlit_smoke.py
      - name: Run research preset tests
        run: python -m unittest discover -s tests -p 'test_research_presets.py' -v

      - name: Smoke test Streamlit 10 combinations
        run: python -m unittest discover -s tests -p 'test_streamlit_smoke.py' -v
